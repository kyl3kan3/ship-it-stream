<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Ship-It Stream • Chat is the PM</title
  ><meta name="viewport" content="width=1920" /><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      background: transparent;
      color: #f5f0ff;
      font:
        22px system-ui,
        sans-serif;
      padding: 42px;
      overflow: hidden;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    h1 {
      font-size: 40px;
      letter-spacing: -2px;
      margin: 0;
    }
    .tag {
      background: #9146ff;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 17px;
    }
    .live {
      margin-left: auto;
      color: #c2b3df;
      font-size: 17px;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #b1ffb1;
      border-radius: 50%;
      margin-right: 10px;
      box-shadow: 0 0 18px #9effbc;
    }
    .grid {
      display: grid;
      grid-template-columns: 620px 1fr;
      gap: 24px;
      margin-top: 26px;
      height: 910px;
    }
    .panel {
      background: linear-gradient(145deg, #20152fee, #100d1ded);
      border: 1px solid #7450a880;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 12px 40px #0005;
    }
    .left {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .queue {
      flex: 1;
    }
    .vote {
      min-height: 310px;
    }
    h2 {
      font-size: 17px;
      color: #c3a5ee;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 22px;
    }
    .item {
      padding: 16px 0;
      border-bottom: 1px solid #ffffff14;
      display: flex;
      gap: 14px;
      font-size: 23px;
    }
    .num {
      color: #a572ff;
      font-weight: 800;
    }
    .muted {
      color: #b2a6c7;
      font-size: 18px;
    }
    .bar {
      height: 9px;
      background: #ffffff12;
      border-radius: 8px;
      overflow: hidden;
      margin: 10px 0 18px;
    }
    .fill {
      background: linear-gradient(90deg, #9146ff, #d69aff);
      height: 100%;
      transition: width 0.4s;
    }
    .right {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .build {
      flex: 1;
    }
    .phase {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -2px;
      margin: 18px 0;
    }
    .coding {
      animation: pulse 1.5s infinite;
    }
    .idea {
      font-size: 30px;
      line-height: 1.4;
      max-width: 900px;
    }
    .stats {
      display: flex;
      gap: 40px;
      margin: 30px 0;
      font-size: 27px;
    }
    .plus {
      color: #aaffbc;
    }
    .minus {
      color: #ff9cbb;
    }
    .files {
      font: 17px monospace;
      color: #c3b6d7;
      white-space: pre-wrap;
    }
    .links {
      display: flex;
      gap: 20px;
      margin-top: 24px;
    }
    a {
      color: #d2b4ff;
      overflow-wrap: anywhere;
      font-size: 19px;
    }
    .banner {
      padding: 18px 24px;
      border-radius: 14px;
      background: #9146ff33;
      border: 1px solid #9146ff;
      font-size: 24px;
    }
    .ticker {
      height: 230px;
      overflow: hidden;
    }
    .event {
      font: 18px monospace;
      padding: 8px 0;
      color: #bcb0cd;
    }
    .event:last-child {
      color: #e4d1ff;
    }
    .footer {
      font-size: 18px;
      color: #bd9fe8;
      margin-top: 22px;
    }
    @keyframes pulse {
      50% {
        opacity: 0.5;
      }
    }
  </style>
  <body>
    <div class="top">
      <h1>SHIP-IT STREAM</h1>
      <span class="tag">CHAT IS THE PM</span
      ><span class="live" id="connection"><i class="dot"></i>CONNECTING</span>
    </div>
    <div class="grid">
      <div class="left">
        <section class="panel queue">
          <h2>01 / Feature queue</h2>
          <div id="queue"></div>
          <div class="footer">!ship your idea</div>
        </section>
        <section class="panel vote">
          <h2 id="vtitle">02 / Live vote</h2>
          <div id="vote"></div>
          <div class="footer">!vote N · one viewer, one vote</div>
        </section>
      </div>
      <div class="right">
        <section class="panel build">
          <h2>03 / Codex build desk</h2>
          <div class="phase" id="phase">Waiting for chat</div>
          <div class="idea" id="idea">Your next idea ships here.</div>
          <div class="stats" id="stats"></div>
          <div class="files" id="files"></div>
          <div class="links" id="links"></div>
        </section>
        <div class="banner" id="banner">
          Suggest → Vote → Build → Review → Ship
        </div>
        <section class="panel ticker">
          <h2>Live activity</h2>
          <div id="events"></div>
        </section>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      let state = {};
      function node(tag, text, cls) {
        const el = document.createElement(tag);
        el.textContent = text;
        if (cls) el.className = cls;
        return el;
      }
      function draw(s) {
        state = s;
        $("queue").replaceChildren(
          ...s.queue.slice(0, 6).map((q, i) => {
            const el = node("div", "", "item");
            el.append(
              node("span", String(i + 1).padStart(2, "0"), "num"),
              node("span", q.text),
            );
            return el;
          }),
        );
        if (!s.queue.length)
          $("queue").append(
            node("p", "The backlog is yours to write.", "muted"),
          );
        $("vote").replaceChildren();
        if (s.round) {
          const values = Object.values(s.round.ballots);
          s.round.candidates.forEach((q, i) => {
            const count = values.filter((v) => v === i + 1).length;
            $("vote").append(
              node("div", `${i + 1}. ${q.text} · ${count}`, "muted"),
            );
            const bar = node("div", "", "bar");
            const fill = node("div", "", "fill");
            fill.style.width =
              (values.length ? (100 * count) / values.length : 0) + "%";
            bar.append(fill);
            $("vote").append(bar);
          });
        } else
          $("vote").append(
            node("p", "A moderator opens the next round.", "muted"),
          );
        const j = s.job;
        $("phase").textContent = j
          ? {
              coding: "Codex is coding",
              review: "Ready for review",
              approved: "Shipped ✓",
              rejected: "Request rejected",
              failed: "Build stopped",
            }[j.phase]
          : "Waiting for chat";
        $("phase").className =
          "phase" + (j?.phase === "coding" ? " coding" : "");
        $("idea").textContent = j?.idea.text ?? "Your next idea ships here.";
        $("stats").replaceChildren();
        if (j?.diff)
          $("stats").append(
            node("span", j.diff.files.length + " files"),
            node("span", "+" + j.diff.added, "plus"),
            node("span", "−" + j.diff.removed, "minus"),
          );
        $("files").textContent = j?.diff?.files.join("\n") ?? "";
        $("links").replaceChildren();
        for (const [label, url] of [
          ["Pull request", j?.pr],
          ["Preview", j?.preview],
        ]) {
          if (url) {
            try {
              if (new URL(url).protocol !== "https:") continue;
              const a = node("a", label + ": " + url);
              a.href = url;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              $("links").append(a);
            } catch {}
          }
        }
        $("banner").textContent =
          j?.phase === "review"
            ? "MOD APPROVAL REQUIRED · !approve / !reject"
            : j?.phase === "approved"
              ? "MERGED · Chat shipped it."
              : (j?.error ?? "Suggest → Vote → Build → Review → Ship");
        $("events").replaceChildren(
          ...s.events
            .slice(-4)
            .map((e) =>
              node(
                "div",
                new Date(e.at).toLocaleTimeString() + "  " + e.text,
                "event",
              ),
            ),
        );
      }
      const stream = new EventSource("/events");
      stream.onmessage = (e) => {
        draw(JSON.parse(e.data));
        $("connection").textContent = "● LIVE / CONNECTED";
      };
      stream.onerror = () => {
        $("connection").textContent = "● RECONNECTING";
      };
      setInterval(() => {
        if (state.round)
          $("vtitle").textContent =
            "02 / Vote · " +
            Math.max(0, Math.ceil((state.round.endsAt - Date.now()) / 1000)) +
            "s";
        else $("vtitle").textContent = "02 / Live vote";
      }, 500);
    </script>
  </body>
</html>
